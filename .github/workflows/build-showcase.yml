name: Build showcase

# Upload screenshots to assets/ (named PREFIX_N.png, e.g. LA_8.png) or edit data/projects.toml,
# and this rebuilds the gallery pages, hero images and README blocks for you.
on:
  push:
    branches: [main]
    paths:
      - "assets/*.png"
      - "assets/*.jpg"
      - "assets/*.jpeg"
      - "assets/*.webp"
      - "assets/*.gif"
      - "data/projects.toml"
      - "scripts/build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-showcase
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Rebuild showcase"
            git pull --rebase origin main
            git push
          fi
