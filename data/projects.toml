prefix = "RH"
kind = "product"
title = "Robust Health"
tagline = "Programming, tracking and nutrition in one app"
summary = "Production fitness platform that writes personalised training and nutrition plans with Claude, then tracks whether members follow them. Members, trainers and admins each get a separately secured portal."
