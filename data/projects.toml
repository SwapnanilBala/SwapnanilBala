# Single source of truth for the portfolio.
#
# Edit this file, then run `python scripts/build.py` (or let the GitHub Action do it).
# It regenerates: the project cards + table in README.md, every page in projects/,
# and the hero images in assets/projects/<slug>/.
#
# Adding a project  -> copy a [[project]] block, give it a unique slug + prefix.
# Adding screenshots -> upload them to assets/ as <PREFIX>_<N>.png (e.g. LA_8.png).
#                       Re-uploading an existing number replaces that screenshot.
#
# Per-project keys
#   slug      folder + page name (assets/projects/<slug>/, projects/<slug>.md)
#   prefix    letters in the screenshot filenames (case-insensitive: LA_1, La_1, la-1 all work)
#   kind      "product"  -> featured card with a hero image   (live apps)
#             "academic" -> row in the compact table            (coursework, research)
#   title, tagline, summary, tech = [..], live = "url", repo = "url"   (live/repo optional)
#   highlights  short facts shown as one line under the summary, e.g. ["561 tests", "23 charts"]
#   hero      screenshot numbers used for the hero collage (default: the first three)
#   bg, accent  hero colours: two background stops + a glow colour
#   captions  one line per screenshot, shown under it on the project page
#   trim_bottom  pixels to cut off the bottom of a screenshot (e.g. a half-visible footer)
#   redact    boxes [x0, y0, x1, y1] (pixels of the ORIGINAL upload) to paint over, e.g. an email

# ------------------------------------------------------------------ products

[[project]]
