<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title">
  <title id="title">Let's build something people actually use.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="170" rx="18"/></clipPath>
    <style>
      .twinkle { animation: twinkle 4.5s ease-in-out infinite; }
      .twinkle.slow { animation-duration: 7s; animation-delay: -2s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .twinkle { animation: none; opacity: 0.8; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <rect width="1200" height="170" fill="url(#dots)"/>
    <circle cx="1080" cy="170" r="260" fill="url(#glowViolet)"/>
    <circle cx="120" cy="0" r="220" fill="url(#glowCyan)"/>
    <rect width="1199" height="169" x="0.5" y="0.5" rx="18" fill="none" stroke="#0f172a" stroke-opacity="0.08"/>

    <!-- the banner's constellation motif, smaller -->
    <g stroke="#0f172a" stroke-opacity="0.14" stroke-width="1" fill="none">
      <path d="M70 52 L140 88 L96 132 M140 88 L216 112 M140 88 L190 40"/>
      <path d="M1130 118 L1060 82 L1104 38 M1060 82 L984 58 M1060 82 L1010 130"/>
    </g>
    <g fill="#0284c7">
      <circle cx="70" cy="52" r="3"/>
      <circle class="twinkle" cx="140" cy="88" r="4.5"/>
      <circle cx="96" cy="132" r="3"/>
      <circle class="twinkle slow" cx="216" cy="112" r="3.5"/>
      <circle cx="190" cy="40" r="2.5"/>
    </g>
    <g fill="#7c3aed">
      <circle cx="1130" cy="118" r="3"/>
      <circle class="twinkle slow" cx="1060" cy="82" r="4.5"/>
      <circle cx="1104" cy="38" r="3"/>
      <circle class="twinkle" cx="984" cy="58" r="3.5"/>
      <circle cx="1010" cy="130" r="2.5"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="78" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="0.5">Let's build something people actually use.</text>
    <rect x="560" y="98.5" width="80" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="600" y="132" font-size="16" font-weight="600" fill="url(#accent)" letter-spacing="1">swapportfolio.vercel.app</text>
  </g>
</svg>
