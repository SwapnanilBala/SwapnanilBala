<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Swapnanil Bala</title>
  <desc id="desc">Applied ML, backend systems and full-stack development. M.S. Data Science, Northeastern University.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#2a1b5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .drift-a { animation: drift-a 18s ease-in-out infinite alternate; }
      .drift-b { animation: drift-b 22s ease-in-out infinite alternate; }
      .twinkle { animation: twinkle 4.5s ease-in-out infinite; }
      .twinkle.slow { animation-duration: 7s; animation-delay: -2s; }
      .twinkle.late { animation-delay: -3s; }
      @keyframes drift-a { to { transform: translate(-140px, 40px); } }
      @keyframes drift-b { to { transform: translate(160px, -30px); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .twinkle { animation: none; }
        .twinkle { opacity: 0.8; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle class="drift-a" cx="1060" cy="20" r="330" fill="url(#glowViolet)"/>
    <circle class="drift-b" cx="130" cy="300" r="260" fill="url(#glowCyan)"/>

    <!-- network / constellation motif -->
    <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" fill="none">
      <path d="M90 70 L170 118 L120 196 L58 236 M170 118 L262 168 M170 118 L232 58 M120 196 L262 168"/>
      <path d="M1110 82 L1030 128 L1086 204 L1148 244 M1030 128 L940 176 M1030 128 L970 66 M1086 204 L940 176"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="90" cy="70" r="3.5"/>
      <circle class="twinkle" cx="170" cy="118" r="5"/>
      <circle cx="120" cy="196" r="3.5"/>
      <circle class="twinkle slow" cx="232" cy="58" r="3"/>
      <circle cx="58" cy="236" r="3"/>
      <circle class="twinkle late" cx="262" cy="168" r="4"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="1110" cy="82" r="3.5"/>
      <circle class="twinkle late" cx="1030" cy="128" r="5"/>
      <circle cx="1086" cy="204" r="3.5"/>
      <circle class="twinkle" cx="970" cy="66" r="3"/>
      <circle cx="1148" cy="244" r="3"/>
      <circle class="twinkle slow" cx="940" cy="176" r="4"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="132" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">Swapnanil Bala</text>
    <text x="600" y="180" font-size="22" font-weight="600" fill="url(#accent)" letter-spacing="1">Applied ML  ·  Backend Systems  ·  Full-Stack</text>
    <line x1="540" y1="208" x2="660" y2="208" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="600" y="246" font-size="16" fill="#9aa4c7" letter-spacing="0.5">M.S. Data Science  ·  Northeastern University</text>
  </g>
</svg>
