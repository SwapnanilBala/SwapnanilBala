<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Swapnanil Bala</title>
  <desc id="desc">Applied ML, backend systems and full-stack development. M.S. Data Science, Northeastern University.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#2a1b5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow2)"/>

  <g text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="120" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="1">Swapnanil Bala</text>
    <text x="600" y="168" font-size="22" font-weight="600" fill="url(#accent)" letter-spacing="1">Applied ML  ·  Backend Systems  ·  Full-Stack</text>
    <line x1="540" y1="196" x2="660" y2="196" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="600" y="232" font-size="16" fill="#9aa4c7" letter-spacing="0.5">M.S. Data Science  ·  Northeastern University</text>
  </g>
</svg>
